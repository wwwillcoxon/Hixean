name: release

# La release de GitHub es la fuente de verdad de la distribucion: Homebrew,
# winget e install.sh solo saben leer de aqui.
#
#   git tag v0.2.0 && git push --tags
#
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: make test
      - run: make size

  # Un artefacto por plataforma. El nombre sale de la etiqueta, asi que la
  # release y tools/dist.sh no pueden discrepar.
  #
  # Solo linux-x64, y no por pereza: es el unico camino de extremo a extremo que
  # esta verde. El perfil freestanding emite _start y syscalls de Linux, asi que
  # sus programas no arrancan fuera de Linux, y la puerta de 12 KiB solo se mide
  # ahi. Los otros cinco targets se anaden cuando su puerta este verde:
  #
  #   linux-arm64   falta el compilador cruzado en la puerta; el resto del camino
  #                 es identico a linux-x64.
  #   macos-*       tests/genericos.hxt falla: la interpolacion de un entero en
  #                 una funcion generica imprime bytes que no son el numero. El
  #                 C generado es identico al de Linux, asi que la causa esta en el
  #                 runtime o en el enlazado, y hace falta un macOS para mirarlo.
  #   windows-*     el compilador construye y el corpus pasa entero (la prueba de
  #                 sockets se omite porque el net del runtime son stubs: no hay
  #                 Winsock). Falta por ahi un camino de instalacion probado y el
  #                 tarball es un zip.
  #
  # Lo que no se hace es publicar los seis y decir en la pagina que cinco no
  # funcionan del todo: un binario que se descarga y no arranca es peor que un
  # binario que todavia no existe.
  artefactos:
    needs: comprobar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, plat: linux-x64, cc: gcc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: compilar
        shell: bash
        run: |
          if [ -n "${{ matrix.cross }}" ]; then
            sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
            make CC=${{ matrix.cross }} PLAT=${{ matrix.plat }}
          else
            make CC=${{ matrix.cc }} PLAT=${{ matrix.plat }}
          fi
      - name: probar
        shell: bash
        run: make test
      - name: empaquetar
        shell: bash
        run: sh tools/dist.sh "${GITHUB_REF_NAME#v}" ${{ matrix.plat }}
      - name: zip para windows
        if: startsWith(matrix.plat, 'windows-')
        shell: bash
        run: |
          cd build/dist && zip -qr "../../dist/hixean-${GITHUB_REF_NAME#v}-${{ matrix.plat }}.zip" \
            "hixean-${GITHUB_REF_NAME#v}-${{ matrix.plat }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hixean-${{ matrix.plat }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # Los checksums se calculan una sola vez, sobre lo que subio cada runner, y se
  # adjuntan a la release. Un checksum por artefacto, no uno por maquina.
  checksums:
    needs: artefactos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: todos
          merge-multiple: true
      - name: SHA256 de cada artefacto
        run: |
          cd todos
          sha256sum *.tar.gz *.zip > SHA256SUMS || true
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: todos/SHA256SUMS

  publicar:
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: todos
          merge-multiple: true
      - name: crear la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            todos/*.tar.gz
            todos/*.zip
        env:
          GH_TOKEN: ${{ github.token }}
      # La segunda subida es la de SHA256SUMS: gh release upload es mas simple
      # de encadenar que volver a crear la release.
      # gh release upload busca el repositorio en el directorio de trabajo, y este
      # job no hace checkout (los artefactos ya vienen descargados): sin --repo
      # falla con «not a git repository» y la release se queda sin SHA256SUMS, que
      # es justo el fichero que install.sh verifica antes de instalar nada.
      - name: adjuntar los checksums
        run: >-
          gh release upload "${GITHUB_REF_NAME}" todos/SHA256SUMS --clobber
          --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}